services:
  - type: web
    name: cloudsent-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install --include=dev && npm run build --workspace @cloudsent/contracts && npm run build --workspace @cloudsent/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PIN_PEPPER
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
